name: FrontendTestSuite

on:
  pull_request:
    branches:
      - Frontend-Branch

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ../../apps/mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm test
