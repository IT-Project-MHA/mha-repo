name: FrontendTestSuite

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      # the repo is an npm workspace, so install from the root
      - name: Install packages
        working-directory: .
        run: npm ci

      - name: Run tests with coverage (must be 70% or more)
        run: >
          npx jest --ci --coverage --watchAll=false
          --coverageThreshold='{"global":{"statements":70,"branches":70,"functions":70,"lines":70}}'
